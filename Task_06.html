<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function diamond(){
            let rows=parseInt(prompt("Enter the number of rows:"),10)
            for (let i=1;i<=rows+1;i++){
               document.write("*".repeat(i)+"<br>");
            }
            for (let j=rows-1;j>=1;j--){
                document.write("*".repeat(j)+"<br>");
            }
            
        }
    diamond()
    </script>
</head>
<body>

    <input type="Button" value="Print Pattern" onclick="diamond()">
</body>
</html>
