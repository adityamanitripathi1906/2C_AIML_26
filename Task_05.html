<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document</title>

    <script>

       function triangle() {
            let rows = parseInt(prompt("Enter the number of rows:"), 10);

            for (let i = 1; i <= rows; i++) {

                for (let j = 1; j <= i; j++) {
                    document.write("* ");
                }

                document.write("<br>");
            }
        }


    triangle(5);
    </script>

</head>
<body>
    <input type="Button" value="Print Pattern" onclick="triangle">
</body>
</html>
