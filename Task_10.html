<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>

    <script>
        function Validate()
        {
            var n = document.Registration.uname.value;

        
            if (n == "" || !isNaN(n))
            {
                alert("Fill Your Name");
                return false;
            }


            var number = document.Registration.Contact.value;

        
            if (number == "" || isNaN(number) || number.length != 10)
            {
                alert("Fill your mobile number correctly");
                return false;
            }


            var e = document.Registration.email.value;

            var atpos = e.lastIndexOf("@");
            var dotpos = e.lastIndexOf(".");

        
            if (e == "" || atpos < 1 || dotpos < atpos + 2 || dotpos + 2 >= e.length)
            {
                alert("Fill a valid email address");
                return false;
            }


            var password = document.Registration.password.value;

        
            if (password == "" || password.length < 8)
            {
                alert("Password must contain at least 8 characters");
                return false;
            }


            alert("Registration Successful");

            return true;
        }
    </script>
</head>

<body>

    <h2>Registration Form</h2>

    <form name="Registration"
          action="#"
          onsubmit="return Validate()">

        Name:
        <input type="text" name="uname">
        <br><br>

        Contact:
        <input type="text" name="Contact">
        <br><br>

        Registration Number:
        <input type="text" name="Registartion">
        <br><br>

        Email:
        <input type="text" name="email">
        <br><br>

        Password:
        <input type="password" name="password">
        <br><br>

        <input type="submit" value="Submit">

    </form>

</body>
</html>
